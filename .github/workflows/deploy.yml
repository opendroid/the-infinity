# Merge to main. Publish the graph, ship the API, ship the site.
#
# Three steps in that order for a reason: the pre-rendered pages read the content
# out of git at build time, so on a clean run the API and the CDN converge within
# one deploy.
#
# There is no rollback. If publish succeeds and a later step fails, Firestore
# holds the new graph while the CDN still serves the last build — which is the
# skew ADR-0003 already designs for, since a page cached last week shows last
# week's tiers while its mini-map shows today's. What is different is that the
# skew persists until someone acts. Every step is idempotent, so the fix is to
# re-run the workflow; the failure that needs a human is a concept deleted from
# git, whose page stays on the CDN with a mini-map that now 404s.
#
# Authentication is workload identity federation. There is no JSON key anywhere
# in this repository and no long-lived credential in its settings — GitHub mints
# a short-lived OIDC token per run and Google exchanges it. See infra/cicd.sh.
name: deploy

on:
  push:
    branches: [main]
  # Re-running a deploy without a new commit is the normal response to a
  # half-finished one: every step here is idempotent.
  workflow_dispatch:

permissions:
  contents: read
  # The OIDC token google-github-actions/auth exchanges. Nothing else needs it,
  # so it is granted here rather than at the top of every workflow.
  id-token: write

# Never cancel a deploy in flight: a run killed between `gcloud run deploy` and
# `firebase deploy` leaves the site and the API on different versions of the
# graph. Queue instead.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: the-infinity-ai
  REGION: us-west1
  SERVICE: api
  IMAGE_REPO: containers
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # Inert until the federation exists. Without this the first merge after this
    # workflow lands fails on main with an authentication error that looks like a
    # broken build, before anyone has had a chance to run infra/cicd.sh.
    # Set the two variables and this starts running; nothing else changes.
    if: vars.WIF_PROVIDER != '' && vars.DEPLOY_SERVICE_ACCOUNT != ''
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 1. Git → Firestore. A full re-sync, and it fails on a dangling edge
      # rather than writing a graph with a hole in it.
      - name: Publish the graph
        working-directory: api
        run: go run ./cmd/publish -project "$PROJECT_ID"

      # 2. The API. Built here rather than by Cloud Build so the image that ships
      # is the one CI already built and tested on this commit.
      - name: Build and push the image
        working-directory: api
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_REPO }}/${{ env.SERVICE }}:${{ github.sha }}

      # Tagged with the commit sha, never `latest`: a rollback is then naming a
      # revision rather than rebuilding and hoping.
      #
      # --service-account, or Cloud Run silently falls back to an Editor-
      # privileged default identity. --max-instances is what actually bounds the
      # bill. See infra/README.md.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --service-account="api-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID}" \
            --min-instances=0 \
            --max-instances=4 \
            --concurrency=80 \
            --cpu=1 --memory=512Mi \
            --allow-unauthenticated \
            --quiet
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_REPO }}/${{ env.SERVICE }}:${{ github.sha }}

      # 3. The site. firebase-tools reads the credentials the auth step wrote,
      # so this needs no token of its own — the FIREBASE_TOKEN CI login is
      # deprecated and is a long-lived credential besides.
      - name: Build the site
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting
        working-directory: web
        run: npx --yes firebase-tools@14 deploy --only hosting --project "$PROJECT_ID" --non-interactive

      # 4. The static search index is what makes the API-offline fallback real
      # rather than aspirational (ADR-0003), and a half-finished deploy can leave
      # it describing a smaller corpus than the pages in front of it. That failure
      # is SILENT: a stale index is valid JSON, passes SearchPanel's shape guard,
      # renders a populated panel, and answers "no results" for a new concept —
      # the same answer as a concept that does not exist. A reader types a name,
      # is told it is not there, and leaves.
      #
      # ADR-0003 asked for this check in its own "Harder" section and it was
      # never built (#322).
      #
      # THE QUERY STRING IS LOAD-BEARING. The CDN keys on the full URL, so a bare
      # fetch seconds after a deploy can be answered from the edge copy of the
      # PREVIOUS index — and a check that passes against a stale cache is a check
      # that passes for the wrong reason, which is this project's recurring
      # failure mode. Hosting matches static files on path alone, so the
      # parameter reaches the right file while defeating the cached entry.
      #
      # The .web.app origin rather than the apex domain, so a DNS problem at the
      # registrar cannot masquerade as a bad deploy. Both serve the same site.
      - name: The deployed index describes the deployed corpus
        run: |
          published=$(ls content/nodes/*.json | wc -l | tr -d ' ')
          url="https://${PROJECT_ID}.web.app/search-index.json?deploy=${GITHUB_SHA}"
          deployed=$(curl -fsS --retry 5 --retry-delay 4 --retry-all-errors "$url" | jq 'length')
          echo "published=$published deployed=$deployed"
          if [ "$published" != "$deployed" ]; then
            echo "::error::The deployed search index has $deployed entries; $published nodes were published."
            echo 'Search would answer "no results" for anything missing from it. Re-run the deploy.'
            exit 1
          fi
